[server]
port_rpc_admin_local
port_ws_public

[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws

[node_size]
small

[ledger_history]
full

[node_db]
type = NuDB
path = /var/lib/rippled/db/nudb
online_delete = 512
advisory_delete = 0

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

[sntp_servers]
time.windows.com
time.apple.com

[validators_file]
/etc/rippled/validators.txt

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
0
