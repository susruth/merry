# Stellar-core standalone configuration for local development
# This runs a single-node network for testing and development

HTTP_PORT=11626
PUBLIC_HTTP_PORT=true
RUN_STANDALONE=true
PARALLEL_LEDGER_APPLY=false

NETWORK_PASSPHRASE="Standalone Merry Network ; February 2026"

NODE_SEED="SDQVDISRYN2JXBS7ICL7QJAEKB3HWBJFP2QECXG7GZICAHBK4UNJCWK2 self"
NODE_IS_VALIDATOR=true

PEER_PORT=11625

DATABASE="postgresql://dbname=stellar user=stellar password=stellar host=localhost port=5432"

# Enable all admin commands for local development
COMMANDS=["ll?level=info"]

# Single node cannot tolerate any failures
FAILURE_SAFETY=0
UNSAFE_QUORUM=true

# Enable unsafe features for local development
ENABLE_SOROBAN_DIAGNOSTIC_EVENTS=true

[QUORUM_SET]
THRESHOLD_PERCENT=100
VALIDATORS=["$self"]
